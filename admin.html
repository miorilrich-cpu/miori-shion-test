<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้านแอดมิน</title>
    <!-- โหลดไลบรารี Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #45a049; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- ส่วนที่ 1: หน้าล็อกอิน -->
    <div id="login-section" class="card">
        <h2>🔐 แอดมินเข้าสู่ระบบ</h2>
        <input type="email" id="email" placeholder="อีเมลแอดมิน">
        <input type="password" id="password" placeholder="รหัสผ่าน">
        <button onclick="login()">เข้าสู่ระบบ</button>
    </div>

    <!-- ส่วนที่ 2: ฟอร์มจัดการข้อมูลหลังล็อกอินแล้ว -->
    <div id="admin-section" class="card hidden">
        <h2>📝 เพิ่ม/แก้ไขข้อมูลเว็บไซต์</h2>
        <p id="admin-user" style="color: #666; font-size: 14px;"></p>
        
        <label>หัวข้อ:</label>
        <input type="text" id="title" placeholder="กรอกหัวข้อ...">

        <label>เนื้อหา:</label>
        <textarea id="description" rows="4" placeholder="กรอกรายละเอียด..."></textarea>

        <label>อัปโหลดรูปภาพจากมือถือ:</label>
        <input type="file" id="imageFile" accept="image/*">

        <button onclick="saveData()">บันทึกข้อมูล</button>
        <button onclick="logout()" style="background: #f44336; margin-top: 10px;">ออกจากระบบ</button>
    </div>

    <script>
        // ใส่ค่า Project URL และ Anon Key ของคุณตรงนี้
        const SUPABASE_URL = 'ใส่_Project_URL_ของคุณ';
        const SUPABASE_ANON_KEY = 'ใส่_anon_public_Key_ของคุณ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // เช็คว่าแอดมินเคยล็อกอินค้างไว้ไหม
        checkUser();

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('ล็อกอินไม่สำเร็จ: ' + error.message);
            } else {
                alert('ล็อกอินสำเร็จ!');
                checkUser();
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            checkUser();
        }

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                document.getElementById('admin-user').innerText = 'เข้าสู่ระบบโดย: ' + session.user.email;
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        }

        // ฟังก์ชันสำคัญ: อัปโหลดรูปภาพเข้า Storage และบันทึกข้อมูลลง Database พร้อมกัน
        async function saveData() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const fileInput = document.getElementById('imageFile');
            let imageUrl = '';

            if (!title) {
                alert('กรุณากรอกหัวข้อด้วยค่ะ');
                return;
            }

            // ถ้าแอดมินเลือกรูปภาพมาด้วย ให้ทำการอัปโหลดก่อน
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`; // ตั้งชื่อไฟล์ใหม่กันชื่อซ้ำ
                const filePath = `${fileName}`;

                // อัปโหลดไปที่ Supabase Storage (ชื่อ bucket ของคุณ เช่น 'images')
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('images')
                    .upload(filePath, file);

                if (uploadError) {
                    alert('อัปโหลดรูปไม่สำเร็จ: ' + uploadError.message);
                    return;
                }

                // ดึง Public URL ของรูปภาพที่เพิ่งอัปโหลด
                const { data: publicUrlData } = supabaseClient.storage
                    .from('images')
                    .getPublicUrl(filePath);

                imageUrl = publicUrlData.publicUrl;
            }

            // บันทึกข้อมูลข้อความและลิงก์รูปภาพลงใน Table (เช่น 'posts')
            const { error: insertError } = await supabaseClient
                .from('posts')
                .insert([
                    { title: title, description: description, image_url: imageUrl }
                ]);

            if (insertError) {
                alert('บันทึกข้อมูลลงฐานข้อมูลไม่สำเร็จ: ' + insertError.message);
            } else {
                alert('บันทึกข้อมูลสำเร็จเรียบร้อย!');
                // ล้างค่าในฟอร์ม
                document.getElementById('title').value = '';
                document.getElementById('description').value = '';
                fileInput.value = '';
            }
        }
    </script>
</body>
</html>
